<div class="auth-page">
  <div class="auth-card">
    <div class="brand"></div>
    <h2>Crear cuenta</h2>

    <div *ngIf="error" class="alert alert-danger">{{error}}</div>
    <div *ngIf="ok" class="alert alert-success">{{ok}}</div>

    <form (ngSubmit)="registrar()">
      <input class="form-control mb-3" [(ngModel)]="nombre" name="nombre" placeholder="Nombre" required>
      <input class="form-control mb-3" type="email" [(ngModel)]="email" name="email" placeholder="Correo" required>
      <input class="form-control mb-3" type="password" [(ngModel)]="password" name="password" placeholder="Contraseña" required>
      <input class="form-control mb-3" type="password" [(ngModel)]="confirmar" name="confirmar" placeholder="Confirmar contraseña" required>

      <select class="form-select mb-4" [(ngModel)]="rol" name="rol">
        <option value="empleado">Empleado</option>
        <option value="administrador">Administrador</option>
      </select>

      <button class="btn btn-success w-100">Registrarse</button>
    </form>

    <div class="text-center mt-3">
      <a routerLink="/login">Ya tengo una cuenta</a>
    </div>
  </div>
</div>
