<div class="auth-page">
  <div class="auth-card">
    <div class="brand">🛒</div>
    <h2>Super Ahorro</h2>
    <p class="text-muted">Sistema de inventario y compras</p>

    <div *ngIf="error" class="alert alert-danger">{{error}}</div>

    <form (ngSubmit)="entrar()">
      <label class="form-label">Correo</label>
      <input class="form-control mb-3" type="email" [(ngModel)]="email" name="email" required>

      <label class="form-label">Contraseña</label>
      <input class="form-control mb-4" type="password" [(ngModel)]="password" name="password" required>

      <button class="btn btn-success w-100" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <div class="text-center mt-3">
      <a routerLink="/registro">Crear una cuenta</a>
    </div>
  </div>
</div>
